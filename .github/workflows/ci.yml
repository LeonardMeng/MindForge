# ROADMAP 0.3：在 Linux、macOS、Windows 上运行 pnpm check 和 pnpm build。
name: CI

on:
  # 推送到任何分支都运行（目前一个人开发，不走 PR）。
  push:
  # 保留 PR 触发，以后有协作者时使用。
  pull_request:

permissions:
  contents: read

# 同一分支 / PR 有新的推送时，取消还在跑的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 一个平台失败时不取消其他平台，三个平台的结果都要看到。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # 不写 version：从 package.json 的 packageManager 读取，和本地保持一致。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # pnpm check 不包含 build；单独构建一次，确保 tsup（含 .d.ts）在三个平台上都能通过。
      - run: pnpm build
